server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # An Angular route is not a file on disk. Without this, reloading any page
    # other than the root returns 404 from nginx before Angular ever runs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The index is fingerprinted, index.html is not: caching it would serve
    # yesterday's app against today's bundles after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The API, through the same origin as the page.
    #
    # One address rather than two: no CORS, one certificate, and one place to
    # put a password. The API container publishes no port of its own, so this
    # is the only way in.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Answers arrive as server-sent events, a token at a time. Buffering
        # them holds the whole answer back and delivers it at the end, which
        # is the opposite of the point.
        proxy_buffering off;
        proxy_cache off;

        # Generation on a CPU is measured in tens of seconds, and indexing a
        # large repository in hours. The default 60s read timeout cuts both.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
