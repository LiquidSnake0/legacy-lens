services:

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/LegacyLens.Api/Dockerfile
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5-coder:3b}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "8080:8080"
    volumes:
      - index-data:/data
      # The repositories to index. Read-only: this tool has no business
      # writing to the code it is being pointed at.
      - ${REPOS_PATH:-./repos}:/repos:ro

volumes:
  ollama-models:
  index-data:
