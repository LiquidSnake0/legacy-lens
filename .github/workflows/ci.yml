name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --verbosity normal

  # The assessment, regenerated on every commit so that it stops being a
  # snapshot somebody produced once and never refreshed. It runs against this
  # repository, which is small, but it is a real end-to-end exercise of the
  # whole analysis: a failure here means the document a client would receive
  # cannot be produced at all.
  #
  # Full history rather than a shallow clone, because the ranking reads change
  # frequency from git and a shallow clone would silently rank on structure
  # alone.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate the assessment
        run: |
          dotnet run --project src/LegacyLens.Api --configuration Release \
                     -- report "$GITHUB_WORKSPACE" > assessment.md
          # An empty or truncated document counts as a failure: the command
          # exiting zero says nothing about whether it wrote a report.
          test -s assessment.md
          grep -q '## In what order' assessment.md

      - uses: actions/upload-artifact@v4
        with:
          name: assessment
          path: assessment.md

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # The frontend tests use Angular's HTTP testing backend, so they need
      # neither the API nor a model.
      - run: npm test -- --watch=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the image in CI is the only way to know the Dockerfile still
      # works, it is the one artefact nobody exercises locally.
      - run: docker build -f src/LegacyLens.Api/Dockerfile -t legacy-lens:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No indexed code or local config may be committed
        run: |
          # repos/.gitkeep is the one allowed path under repos/: an empty
          # marker so `docker compose up` does not create the bind mount
          # target as root. Exactly that path, not a pattern, so anything
          # else appearing under repos/ still fails.
          leaked=$(git ls-files \
                   | grep -E '(^|/)(repos/|\.env$)|\.db$' \
                   | grep -vx 'repos/.gitkeep' || true)
          if [ -n "$leaked" ]; then
            echo "These must never be tracked:"
            echo "$leaked"
            exit 1
          fi
