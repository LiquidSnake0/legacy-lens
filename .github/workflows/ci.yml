name: build

on:
  push:
    branches: [main]
    # A tag publishes a named version. Everything else publishes latest and a
    # commit sha, so there is always an image that matches a known commit.
    tags: ['v*']
  pull_request:

jobs:

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      # `--logger trx` and the upload below exist because a run went red and
      # nothing here could say which test. The console output is not kept, the
      # API does not expose it without a token, and the failure did not
      # reproduce locally in Release even under load. A red build that cannot
      # name its own failure costs more than the failure.
      - run: dotnet test --no-build --configuration Release --verbosity normal --logger 'trx;LogFileName=tests.trx'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 30

  # The assessment, regenerated on every commit so that it stops being a
  # snapshot somebody produced once and never refreshed. It runs against this
  # repository, which is small, but it is a real end-to-end exercise of the
  # whole analysis: a failure here means the document a client would receive
  # cannot be produced at all.
  #
  # Full history rather than a shallow clone, because the ranking reads change
  # frequency from git and a shallow clone would silently rank on structure
  # alone.
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate the assessment
        run: |
          dotnet run --project src/LegacyLens.Api --configuration Release \
                     -- report "$GITHUB_WORKSPACE" > assessment.md
          # An empty or truncated document counts as a failure: the command
          # exiting zero says nothing about whether it wrote a report.
          test -s assessment.md
          grep -q '## In what order' assessment.md

      - uses: actions/upload-artifact@v4
        with:
          name: assessment
          path: assessment.md

  # The suite runs against the classes; this runs against the server. The two
  # are not the same check, and the difference is not theoretical: deleting a
  # workspace nothing had been indexed into returned 500 while every unit test
  # was green, because they all index something first and so create the ledger
  # table on the way past. Nothing but a started instance says whether the
  # endpoints work.
  #
  # Only the endpoints that need no model, which is why ask and ingest are
  # absent: pulling model weights here would turn a two-minute job into a long
  # one to test code this job is not about.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Exercise the API against a running instance
        run: |
          set -euo pipefail

          body=$(mktemp)
          call() { curl -s -o "$body" -w '%{http_code}' "$@"; }
          expect() {
            if [ "$2" != "$3" ]; then
              echo "$1: wanted $2, got $3"; cat "$body"; exit 1
            fi
            echo "ok  $1 -> $3"
          }

          INDEX_PATH="$RUNNER_TEMP/smoke.db" ASPNETCORE_URLS=http://127.0.0.1:5199 \
            dotnet run --project src/LegacyLens.Api --configuration Release \
                       --no-launch-profile > "$RUNNER_TEMP/api.log" 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT

          for _ in $(seq 1 90); do
            curl -sf -m 2 http://127.0.0.1:5199/api/health > /dev/null 2>&1 && break
            sleep 1
          done

          expect "health" 200 "$(call http://127.0.0.1:5199/api/health)"

          expect "create a workspace" 201 \
            "$(call -X POST http://127.0.0.1:5199/api/workspaces \
                    -H 'content-type: application/json' \
                    -d '{"name":"Smoke","rootPath":"/tmp"}')"
          export BODY="$body"
          id=$(python3 -c 'import json,os;print(json.load(open(os.environ["BODY"]))["id"])')

          expect "a name is required" 400 \
            "$(call -X POST http://127.0.0.1:5199/api/workspaces \
                    -H 'content-type: application/json' -d '{"name":"  "}')"

          expect "delete a workspace never indexed into" 204 \
            "$(call -X DELETE http://127.0.0.1:5199/api/workspaces/$id)"
          expect "delete it again" 404 \
            "$(call -X DELETE http://127.0.0.1:5199/api/workspaces/$id)"

          expect "seams over this repository" 200 \
            "$(call -X POST http://127.0.0.1:5199/api/seams \
                    -H 'content-type: application/json' \
                    -d "{\"path\":\"$GITHUB_WORKSPACE/src\"}")"

          expect "the risk ranking, which needs no model" 200 \
            "$(call -X POST http://127.0.0.1:5199/api/risk \
                    -H 'content-type: application/json' \
                    -d "{\"path\":\"$GITHUB_WORKSPACE/src\",\"top\":3}")"

          expect "which models are offered" 200 "$(call http://127.0.0.1:5199/api/models)"

          # The conversions, over this repository. Modern projects, so every
          # kind has nothing to do, and answering that is the check: an empty
          # patch with a reason beats a 500.
          for kind in packages sdk versions config; do
            expect "convert: $kind" 200 \
              "$(call -X POST http://127.0.0.1:5199/api/convert \
                      -H 'content-type: application/json' \
                      -d "{\"path\":\"$GITHUB_WORKSPACE/src\",\"kind\":\"$kind\"}")"
          done

          expect "an unknown conversion is refused" 400 \
            "$(call -X POST http://127.0.0.1:5199/api/convert \
                    -H 'content-type: application/json' \
                    -d "{\"path\":\"$GITHUB_WORKSPACE/src\",\"kind\":\"nope\"}")"

          # A repository URL git should never be handed. ext:: runs a command
          # as the transport, so this one has to be refused before git sees it.
          expect "a transport that runs commands is refused" 400 \
            "$(call -X POST http://127.0.0.1:5199/api/workspaces \
                    -H 'content-type: application/json' \
                    -d '{"name":"Bad","repositoryUrl":"ext::sh -c touch /tmp/pwned"}')"
          test ! -e /tmp/pwned

          # The one capability that runs code, off unless the operator turned
          # it on. Asserted here because it is a property of the shipped
          # default rather than of any one line: a server that starts running
          # what it is handed because somebody flipped a default is the
          # regression worth catching in CI rather than in the wild.
          expect "running code is refused unless allowed" 403 \
            "$(call -X POST http://127.0.0.1:5199/api/equivalence \
                    -H 'content-type: application/json' \
                    -d '{"before":"a.cs","after":"b.cs"}')"

          # A project whose folder is not there names the mistake now, rather
          # than being created happily and failing on every question after.
          expect "a folder that is not there is refused" 400 \
            "$(call -X POST http://127.0.0.1:5199/api/workspaces \
                    -H 'content-type: application/json' \
                    -d '{"name":"Typo","rootPath":"/no/such/folder"}')"

          # Indexing as a job. No model here, so it fails, and failing as a
          # reported state rather than as an exception on a thread nobody
          # watches is exactly what is being checked.
          expect "start an indexing run" 202 \
            "$(call -X POST http://127.0.0.1:5199/api/ingest/start \
                    -H 'content-type: application/json' \
                    -d "{\"path\":\"$GITHUB_WORKSPACE/src\",\"workspace\":\"default\"}")"

          for _ in $(seq 1 30); do
            state=$(call "http://127.0.0.1:5199/api/ingest/status?workspace=default" > /dev/null
                    python3 -c 'import json,os;print(json.load(open(os.environ["BODY"]))["state"])')
            [ "$state" = "running" ] || break
            sleep 1
          done
          echo "ok  the run reported a final state -> $state"
          test "$state" != "running"

          if [ -s "$RUNNER_TEMP/api.log" ] && grep -q 'Unhandled exception' "$RUNNER_TEMP/api.log"; then
            echo "The server logged an unhandled exception:"
            cat "$RUNNER_TEMP/api.log"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      # The frontend tests use Angular's HTTP testing backend, so they need
      # neither the API nor a model.
      - run: npm test -- --watch=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Building the images in CI is the only way to know the Dockerfiles still
      # work: they are the artefacts nobody exercises locally.
      #
      # Both of them. The web one had been shipped in the compose file and
      # built by nothing here, so a broken frontend image would have been found
      # by whoever ran `docker compose up` next.
      - run: docker build -f src/LegacyLens.Api/Dockerfile -t legacy-lens-api:ci .
      - run: docker build -f web/Dockerfile -t legacy-lens-web:ci .

  # Publishing, and only ever after everything above is green. A registry
  # holding an image whose tests never passed is worse than no registry: it
  # looks like a release.
  publish:
    needs: [dotnet, report, smoke, web, docker, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The only extra right this workflow asks for. The token is issued per
      # run by GitHub, so nothing here needs a secret anybody has to create,
      # rotate, or remember to revoke.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        run: |
          set -euo pipefail

          # GHCR insists on lowercase and this owner is not, so the name is
          # folded rather than written out: a fork should publish to its own
          # namespace without editing this file.
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)

          publish() {
            name=$1
            dockerfile=$2
            target="ghcr.io/${repo}-${name}"

            # The sha tag is the one that means something. latest is a
            # convenience that will point somewhere else tomorrow.
            tags="-t ${target}:${sha} -t ${target}:latest"

            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tags="${tags} -t ${target}:${GITHUB_REF_NAME}"
            fi

            # The version label is set explicitly because the base images set
            # their own: without this the API image announces version 24.04,
            # which is Ubuntu's and not ours.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              version="${GITHUB_REF_NAME}"
            else
              version="${sha}"
            fi

            # The source label is what ties the package to this repository on
            # GHCR. Without it the package appears unattached and inherits
            # nothing, including the readme nobody would find.
            docker build -f "${dockerfile}" ${tags} \
              --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
              --label org.opencontainers.image.revision="${GITHUB_SHA}" \
              --label org.opencontainers.image.version="${version}" \
              --label org.opencontainers.image.licenses=MIT \
              .

            docker push --all-tags "${target}"

            echo "pushed ${target}:${sha}"
          }

          publish api src/LegacyLens.Api/Dockerfile
          publish web web/Dockerfile

  # Putting the published images on a server.
  #
  # Inert until somebody configures a server: with no DEPLOY_HOST secret this
  # says so and exits zero. A deploy job that fails for want of a destination
  # turns the whole pipeline red over a machine that does not exist.
  #
  # It sends the compose file and the Caddyfile, then pulls and restarts. The
  # .env with the password and the domain lives on the server and is never in
  # this repository.
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DIRECTORY: ${{ vars.DEPLOY_DIRECTORY || '/srv/legacy-lens' }}
        run: |
          set -euo pipefail

          if [ -z "${HOST}" ]; then
            echo "No DEPLOY_HOST secret is set, so there is nowhere to deploy to."
            echo "That is a configuration this repository does not have yet, not a failure."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${KEY}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${KNOWN_HOSTS}" ]; then
            printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            # Trusting whatever answers the first time. Set DEPLOY_KNOWN_HOSTS
            # to the output of `ssh-keyscan your.host` and this branch goes
            # away: without it, a machine in the middle can be the server.
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set, so the host key is being trusted on sight."
            ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          chmod 600 ~/.ssh/known_hosts

          ssh_opts="-i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes"
          target="${USER}@${HOST}"
          sha=$(echo "${GITHUB_SHA}" | cut -c1-7)

          ssh ${ssh_opts} "${target}" "mkdir -p ${DIRECTORY}"

          scp ${ssh_opts} docker-compose.prod.yml Caddyfile "${target}:${DIRECTORY}/"

          # The exact images this commit published, not latest. Latest is a
          # moving target and deploying one is how a server ends up running
          # something nobody chose.
          ssh ${ssh_opts} "${target}" "
            set -e
            cd ${DIRECTORY}
            export LENS_VERSION=${sha}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
          "

          echo "deployed ${sha} to ${HOST}:${DIRECTORY}"

      - name: Check it answers
        env:
          URL: ${{ secrets.DEPLOY_URL }}
          CREDENTIALS: ${{ secrets.DEPLOY_CREDENTIALS }}
        run: |
          set -euo pipefail

          if [ -z "${URL}" ]; then
            echo "No DEPLOY_URL secret, so nothing was checked from outside."
            exit 0
          fi

          # A deploy that reports success without asking the server anything is
          # a deploy that reports success when the container failed to start.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                        ${CREDENTIALS:+-u "${CREDENTIALS}"} "${URL}/api/health" || true)

            if [ "${code}" = "200" ]; then
              echo "the deployed instance answered 200"
              exit 0
            fi

            echo "attempt ${attempt}: ${code}"
            sleep 10
          done

          echo "::error::the deployed instance never answered 200"
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No indexed code or local config may be committed
        run: |
          # repos/.gitkeep is the one allowed path under repos/: an empty
          # marker so `docker compose up` does not create the bind mount
          # target as root. Exactly that path, not a pattern, so anything
          # else appearing under repos/ still fails.
          leaked=$(git ls-files \
                   | grep -E '(^|/)(repos/|\.env$)|\.db$' \
                   | grep -vx 'repos/.gitkeep' || true)
          if [ -n "$leaked" ]; then
            echo "These must never be tracked:"
            echo "$leaked"
            exit 1
          fi
